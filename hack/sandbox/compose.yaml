# Single-node kuso sandbox. Driven by up.sh / down.sh — see README.md.
name: kuso-sandbox

services:
  node:
    image: ${KUSO_SANDBOX_K3S_IMAGE:-rancher/k3s:v1.31.9-k3s1}
    container_name: kuso-sandbox-node
    hostname: kuso-sandbox
    command:
      - server
      # Same as install.sh: kuso installs its own traefik.
      - --disable=traefik
      # The node shares the Docker VM's disk, which on a dev machine is
      # often nearly full; kubelet's default 5%/10% thresholds would evict
      # every pod. k3d sets the same.
      - --kubelet-arg=eviction-hard=imagefs.available<1%,nodefs.available<1%
      - --kubelet-arg=eviction-minimum-reclaim=imagefs.available=1%,nodefs.available=1%
    privileged: true
    restart: unless-stopped
    tmpfs:
      - /run
      - /var/run
    ulimits:
      nproc: 65535
      nofile:
        soft: 65535
        hard: 65535
    environment:
      K3S_KUBECONFIG_OUTPUT: /output/kubeconfig.yaml
      K3S_KUBECONFIG_MODE: "644"
    volumes:
      - k3s:/var/lib/rancher/k3s
      - kubeconfig:/output
      # Has to be in place before k3s starts; containerd only reads it at boot.
      - ./registries.yaml:/etc/rancher/k3s/registries.yaml:ro
    ports:
      # Both loopbacks: *.localhost resolves to ::1 first on macOS, so an
      # IPv4-only bind lets any other process on [::1]:<port> answer instead.
      - "127.0.0.1:${KUSO_SANDBOX_PORT:-18080}:80"
      - "[::1]:${KUSO_SANDBOX_PORT:-18080}:80"
      - "127.0.0.1:${KUSO_SANDBOX_API_PORT:-16443}:6443"

  # kubectl + helm. Shares the node's network namespace so the kubeconfig's
  # https://127.0.0.1:6443 works unmodified. Run on demand, never as a daemon.
  tools:
    image: alpine/k8s:1.30.4
    profiles: [tools]
    network_mode: service:node
    environment:
      KUBECONFIG: /kube/kubeconfig.yaml
    volumes:
      - kubeconfig:/kube:ro
      - ../..:/repo:ro
    working_dir: /repo
    entrypoint: ["bash"]

volumes:
  k3s:
  kubeconfig:

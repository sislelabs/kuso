# Mirrors the entry hack/install.sh writes: lets the node's containerd pull
# from the in-cluster registry over plain HTTP. The hostname resolves through
# the /etc/hosts line up.sh stamps into the node.
mirrors:
  # Docker Hub rate-limits shared IPs hard enough to stall a bring-up.
  # mirror.gcr.io caches popular images; containerd falls back to
  # Docker Hub itself for anything the mirror doesn't have.
  docker.io:
    endpoint:
      - "https://mirror.gcr.io"
  # Host-arch builds of kuso's own Job images; see the mirror service in
  # compose.yaml. containerd falls back to ghcr.io for everything else.
  ghcr.io:
    endpoint:
      - "http://mirror:5000"
  "kuso-registry.kuso.svc.cluster.local:5000":
    endpoint:
      - "http://kuso-registry.kuso.svc.cluster.local:5000"
configs:
  "kuso-registry.kuso.svc.cluster.local:5000":
    tls:
      insecure_skip_verify: true
    # Registry auth is on by default, as on a fresh install. Well-known dev
    # credential; bootstrap.sh writes the same pair into kuso-registry-auth.
    auth:
      username: kuso
      password: "6b75736f2d73616e64626f782d6465762d6f6e6c79"

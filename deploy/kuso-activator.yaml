# kuso-activator — the scale-to-zero request-holding proxy.
#
# Runs the kuso-server image in `--activator` mode. For sleep-enabled
# services the kusoenvironment Ingress routes its backend directly here
# (not the app's own Service): the activator resolves the target env from
# the Host header, scales its Deployment to 1, holds the request until
# the Service has a ready endpoint, then reverse-proxies it. A request to
# a slept (0-replica) app is served instead of 503-ing; when the app is
# awake the activator passes through transparently (~15ms overhead).
#
# See docs/design/SCALE_TO_ZERO.md.
#
# Runs as its OWN ServiceAccount. It is the one kuso component that
# parses arbitrary internet traffic (every unclaimed Host lands here via
# the catch-all route below), so a proxy bug must not hand out
# kuso-server's token (cluster-wide Secret read, node delete, RBAC
# writes). Its kube calls, from internal/activator + scaledown.Wake:
#   kusoenvironments  list (resolve Host), get + update (wake, activity stamp)
#   endpointslices    list (wake readiness); endpoints get (legacy fallback)
#   deployments       patch spec.replicas (wake)
#   pods              list (fail a held request fast when the woken pod
#                     can't start; skipped if this rule is missing)
# deployments patch has to be cluster-wide (project namespaces are
# created at runtime) and kusoenvironments update would let a
# compromised activator rewrite an env's image; both are narrowed by the
# kuso-activator-scope ValidatingAdmissionPolicy in
# deploy/kuso-admission-policy.yaml (managed namespaces only, replicas /
# replicaCount + activity annotations only).
#
# The self-updater cannot apply the ClusterRole/Binding (kuso-server
# can't grant cluster-wide deployments patch); a cluster admin applies
# this file once. hack/release.sh excludes them from upgrade-manifests.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuso-activator
  namespace: kuso
  labels: { app.kubernetes.io/name: kuso-activator }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kuso-activator
  labels: { app.kubernetes.io/name: kuso-activator }
rules:
  - apiGroups: [application.kuso.sislelabs.com]
    resources: [kusoenvironments]
    verbs: [get, list, update]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
  - apiGroups: [""]
    resources: [endpoints]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kuso-activator
  labels: { app.kubernetes.io/name: kuso-activator }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kuso-activator
subjects:
  - kind: ServiceAccount
    name: kuso-activator
    namespace: kuso
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuso-activator
  namespace: kuso
  labels:
    app.kubernetes.io/name: kuso-activator
spec:
  # Two replicas: the activator is in the request path for waking apps,
  # so it must survive a node drain without dropping wakes. They don't
  # coordinate — all shared state is on the Deployment objects they
  # scale, so racing replicas converge.
  replicas: 2
  selector:
    matchLabels: { app.kubernetes.io/name: kuso-activator }
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kuso-activator }
    spec:
      serviceAccountName: kuso-activator
      priorityClassName: kuso-platform
      # On SIGTERM the activator keeps accepting for 5s (traefik lag), then
      # drains in-flight requests for up to KUSO_ACTIVATOR_DRAIN_SECONDS.
      # 5 + 65 covers a full 60s wake hold and still exits before SIGKILL.
      terminationGracePeriodSeconds: 75
      # Spread the two replicas so one node drain or loss can't take both.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: kuso-activator }
      # Soft on purpose: a required spread would leave a single-node
      # install's second replica (and every maxSurge rollout) Pending.
      # Neither rule moves a running pod, so nodewatch also evicts one
      # replica when both end up on the same node and another can take it.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: kuso-activator }
      # uid/gid 100/101 = the image's `kuso` user (server-go/Dockerfile
      # adduser -S). Numeric because runAsNonRoot can't verify a named
      # USER. Activator mode writes nothing to disk, hence the read-only
      # root filesystem.
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: activator
          image: ghcr.io/sislelabs/kuso-server-go:v0.44.0
          args: ["--activator"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - { name: KUSO_HTTP_ADDR, value: ":3000" }
            - { name: KUSO_NAMESPACE, value: kuso }
            - { name: KUSO_ACTIVATOR_DRAIN_SECONDS, value: "65" }
            # ~80% of the memory limit: the GC works harder before the
            # kernel OOM-kills the one proxy every sleep-routed app uses.
            - { name: GOMEMLIMIT, value: "200MiB" }
          ports:
            - { name: http, containerPort: 3000 }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 2
            periodSeconds: 10
          resources:
            # A fixed shared cost in front of every sleep-routed app. The
            # CPU request sets its share under contention (builds on the
            # same node): at 25m a junk-Host flood measured ~350m and every
            # proxied request queued behind buildkitd.
            requests: { cpu: 100m, memory: 64Mi }
            limits: { memory: 256Mi }
---
# Every sleep-routed host goes through the activator, so a node drain must
# never evict both replicas at once.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kuso-activator
  namespace: kuso
  labels: { app.kubernetes.io/name: kuso-activator }
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kuso-activator }
---
apiVersion: v1
kind: Service
metadata:
  name: kuso-activator
  namespace: kuso
  labels: { app.kubernetes.io/name: kuso-activator }
spec:
  selector: { app.kubernetes.io/name: kuso-activator }
  ports:
    - { name: http, port: 80, targetPort: 3000, protocol: TCP }
---
# Catch-all fallback route. A domain pointed at kuso with NO matching
# service (e.g. a base domain when only www.<domain> is configured, or a
# typo'd host) otherwise lands on traefik's bare "404 page not found".
# This lowest-priority PathPrefix(`/`) route claims every host no specific
# Ingress matches and sends it to the activator, which serves a branded
# "no service here" page. `priority: 1` guarantees any real per-service
# route (they don't set priority → default higher) wins, so this only ever
# catches genuinely-unclaimed hosts. Rendered on plain HTTP; the websecure
# variant relies on traefik's default cert (an unclaimed host has no kuso
# cert, so the browser shows "Not secure" — the branded page still renders).
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: kuso-activator-catchall
  namespace: kuso
  labels: { app.kubernetes.io/name: kuso-activator }
spec:
  entryPoints: [web, websecure]
  routes:
    - match: PathPrefix(`/`)
      kind: Rule
      priority: 1
      services:
        - name: kuso-activator
          port: 80

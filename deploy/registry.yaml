# In-cluster Docker registry. Lives at kuso-registry.kuso.svc.cluster.local:5000.
#
# Used by the build pipeline as the destination for kaniko builds. Each
# KusoEnvironment then pulls FROM this registry. Internal-only: no
# Ingress, no public DNS, no TLS. The k3s nodes need to trust the
# registry as an insecure (plain-HTTP) registry — handled in
# hack/install.sh by writing /etc/rancher/k3s/registries.yaml.
#
# AUTH (staged, off by default). The registry stays anonymous until the
# kuso-registry-auth Secret says enabled=true. Distribution has no
# "optional auth" mode, so every consumer must hold the credential before
# it is switched on, or every pull on a node without it fails:
#
#   1. Mint the credential (enabled=false; nothing changes yet):
#        kuso api POST admin/registry-auth/credentials
#      kuso-server, builds (per-namespace kuso-registry-push Secret), the
#      vuln scanner and nodes that join from now on pick it up by
#      themselves. The registry ignores credentials while auth is off.
#   2. Apply this file (registry restarts once, still anonymous).
#   3. Put the credential on every EXISTING node, control plane included,
#      one node at a time: run hack/registry-auth-node.sh as root on the
#      node (password on stdin; it restarts k3s / k3s-agent).
#   4. Verify:  kuso api POST admin/registry-auth/probe
#               kuso api GET admin/registry-auth    -> readyToEnable: true
#   5. Enable:  kubectl -n kuso patch secret kuso-registry-auth \
#                 -p '{"stringData":{"enabled":"true"}}'
#               kubectl -n kuso rollout restart deploy/kuso-registry
#      Revert:  the same patch with "false", then the same restart.
#
# The credential is one htpasswd user. It stops tenant app pods, addon
# pods and Dockerfile RUN steps (which never see it) from pushing,
# overwriting or deleting images. Build pods hold it because they push,
# so a buildpacks build running PR code can still use it; per-repository
# scoping needs token auth (OPEN.md N6 option a).

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kuso-registry-data
  namespace: kuso
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuso-registry
  namespace: kuso
  labels:
    app.kubernetes.io/name: kuso-registry
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: kuso-registry
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kuso-registry
    spec:
      # Every reschedule and wake pulls from here: let the kubelet evict
      # tenant pods before the registry under node pressure (RUN-7).
      priorityClassName: kuso-platform
      automountServiceAccountToken: false
      containers:
        - name: registry
          image: registry:3.1.2
          # Same as the image's entrypoint (registry serve <config>), plus
          # the opt-in htpasswd switch read from kuso-registry-auth.
          command: [/bin/sh, -ec]
          args:
            - |
              if [ "$(cat /auth/enabled 2>/dev/null)" = "true" ]; then
                if [ ! -s /auth/htpasswd ]; then
                  echo "[registry] kuso-registry-auth enabled=true but htpasswd is empty; refusing to start" >&2
                  exit 1
                fi
                export REGISTRY_AUTH=htpasswd
                export REGISTRY_AUTH_HTPASSWD_REALM=kuso-registry
                export REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd
                echo "[registry] htpasswd auth required"
              else
                echo "[registry] anonymous access (kuso-registry-auth not enabled)"
              fi
              exec registry serve /etc/distribution/config.yml
          ports:
            - name: registry
              containerPort: 5000
          env:
            - name: REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY
              value: /var/lib/registry
            # Allow image deletion via DELETE — useful for the cleanup
            # job that prunes preview-env builds.
            - name: REGISTRY_STORAGE_DELETE_ENABLED
              value: "true"
            # The registry:3 image's bundled config logs at debug and
            # serves pprof + /metrics on :5001; keep registry:2's info
            # logging and no debug listener.
            - name: REGISTRY_LOG_LEVEL
              value: info
            - name: REGISTRY_HTTP_DEBUG_ADDR
              value: ""
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
            - name: auth
              mountPath: /auth
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: registry
            initialDelaySeconds: 5
            periodSeconds: 5
          # SCL-14: one pod serves every cold pull; losing a node means
          # dozens of concurrent pulls through it.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kuso-registry-data
        # optional: without the Secret the registry starts anonymous.
        - name: auth
          secret:
            secretName: kuso-registry-auth
            optional: true
            items:
              - { key: htpasswd, path: htpasswd }
              - { key: enabled, path: enabled }
---
apiVersion: v1
kind: Service
metadata:
  name: kuso-registry
  namespace: kuso
  labels:
    app.kubernetes.io/name: kuso-registry
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: kuso-registry
  ports:
    - name: registry
      port: 5000
      targetPort: registry
---
# v0.9.38: weekly registry GC. The registry binary supports DELETE
# (REGISTRY_STORAGE_DELETE_ENABLED=true above), but every push leaves
# orphan blobs that the registry's own `garbage-collect` subcommand
# has to compact. Without this CronJob, a busy build cluster fills the
# 20Gi PVC silently and kaniko push starts failing with opaque "no
# space left on device" errors that point nowhere obvious.
#
# `--delete-untagged=true` removes blobs no tag references — needed
# because deleting a manifest without this flag leaves the layer
# blobs orphaned forever. GC isn't safe under concurrent WRITES, so the
# registry is switched to read-only maintenance mode for the duration
# (SCL-14): pulls keep working, only pushes (builds) fail until GC ends.
# The switch is an env var, so it costs two short Recreate restarts
# instead of the old scale-to-zero, which took every cold pull, wake and
# reschedule down for the whole GC run.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kuso-registry-gc
  namespace: kuso
  labels:
    app.kubernetes.io/name: kuso-registry-gc
spec:
  schedule: "17 3 * * 0"  # 03:17 every Sunday
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: kuso-registry-gc
    spec:
      backoffLimit: 1
      # Reap the finished Job (+ its pods) 24h after completion so a failed
      # GC run doesn't linger as an Error pod until the CronJob history
      # limit rotates it out. Matches the TTL convention on kuso's other
      # Jobs (release, previewdb, pkgupdates). successfulJobsHistoryLimit/
      # failedJobsHistoryLimit above still bound how many run records are
      # kept; this ensures timely pod cleanup on top of that.
      ttlSecondsAfterFinished: 86400
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: kuso-registry-gc
          # Single pod, three containers:
          #
          #   initContainer readonly-on — sets the registry Deployment's
          #     REGISTRY_STORAGE_MAINTENANCE_READONLY and waits for the
          #     read-only pod to be the only one running.
          #
          #   gc         — runs the registry binary against the same PVC.
          #     RWO is per node and the local-path PV pins this pod to the
          #     registry's node, so both can mount it; the live registry
          #     only reads while GC runs.
          #
          #   scaler-up  — waits for gc and switches read-only off again.
          #     It also restores on pod termination and after a 10m
          #     failure ceiling, so the registry can't stay read-only.
          initContainers:
            - name: readonly-on
              image: alpine/k8s:1.35.10
              command: [/bin/sh, -ec]
              args:
                - |
                  set -e
                  echo "[gc] switching registry to read-only (GC is not safe under concurrent writes)"
                  kubectl -n kuso set env deployment/kuso-registry 'REGISTRY_STORAGE_MAINTENANCE_READONLY={"enabled":true}'
                  kubectl -n kuso rollout status deployment/kuso-registry --timeout=180s
          containers:
            - name: gc
              image: registry:3.1.2
              command: [/bin/sh, -ec]
              args:
                - |
                  set -e
                  echo "[gc] running garbage-collect"
                  registry garbage-collect /etc/distribution/config.yml --delete-untagged=true
                  echo "[gc] done"
              volumeMounts:
                - { name: data, mountPath: /var/lib/registry }
            - name: scaler-up
              # Sidecar that waits for `gc` to finish and switches the
              # registry back to read-write. We can't rely on
              # initContainer ordering for "post-main" work, so this
              # sidecar pattern is the simplest correct shape.
              #
              # CORRECTNESS: writes must only resume once GC has
              # genuinely finished (exit 0) or been abandoned.
              # Under restartPolicy=OnFailure a non-zero gc exit is
              # TRANSIENT — kubelet restarts the container in-pod — so
              # restoring on "terminated" alone would let a restarted
              # GC run concurrently with live registry writes, which
              # the registry README explicitly calls unsafe. So:
              #   - terminated exitCode==0        → restore, exit 0
              #   - gc failing (terminated!=0 or CrashLoopBackOff) →
              #     keep the registry down so a kubelet-restarted GC
              #     can't run concurrently with live writes — BUT only
              #     up to a hard ceiling. A crash-looping GC cycles
              #     terminated→waiting→running→terminated, so we must
              #     NOT reset the ceiling clock on the transient
              #     running/waiting phases (that's the bug that let a
              #     CrashLoopBackOff keep the registry at 0 forever).
              #     We arm the clock the FIRST time GC is observed
              #     failing (a non-empty exitCode OR a restartCount>0)
              #     and never rewind it until GC succeeds. 10m armed
              #     without success → assume GC won't recover, restore
              #     and fail so the registry can't stay down.
              #   - pod killed (Job backoffLimit exhausted deletes the
              #     pod) → TERM trap restores on the way out, inside
              #     the pod's 30s grace period.
              image: alpine/k8s:1.35.10
              command: [/bin/sh, -ec]
              args:
                - |
                  set -e
                  POD=$(hostname)
                  scale_up() {
                    echo "[scaler-up] switching registry back to read-write"
                    kubectl -n kuso set env deployment/kuso-registry REGISTRY_STORAGE_MAINTENANCE_READONLY-
                    # Installs GC'd by the pre-read-only version of this job
                    # may have been left at 0 replicas by an abandoned run.
                    kubectl -n kuso scale deployment kuso-registry --replicas=1
                    kubectl -n kuso rollout status deployment kuso-registry --timeout=120s || true
                  }
                  # Abandonment path: the Job controller terminates the
                  # pod once backoffLimit is exhausted. Restore the
                  # registry before dying — nothing else will.
                  trap 'echo "[scaler-up] pod terminating — restoring registry"; scale_up; exit 0' TERM INT
                  echo "[scaler-up] waiting for gc container in pod $POD"
                  # FAILING_SINCE arms the first time we see gc fail and
                  # is NEVER rewound until gc succeeds — so a crash loop
                  # (which oscillates through running/waiting between
                  # failures) still trips the 10m ceiling.
                  FAILING_SINCE=""
                  while true; do
                    GC_STATUS=$(kubectl -n kuso get pod "$POD" \
                      -o jsonpath='{.status.containerStatuses[?(@.name=="gc")]}' 2>/dev/null || echo "")
                    EXIT_CODE=$(echo "$GC_STATUS" | sed -n 's/.*"terminated":{[^}]*"exitCode":\([0-9-]*\).*/\1/p')
                    RESTARTS=$(echo "$GC_STATUS" | sed -n 's/.*"restartCount":\([0-9]*\).*/\1/p')
                    if [ "$EXIT_CODE" = "0" ]; then
                      echo "[scaler-up] gc succeeded"
                      scale_up
                      echo "[scaler-up] done"
                      exit 0
                    fi
                    # Arm (once) the abandonment clock as soon as gc has
                    # failed at least once: a non-zero terminated exit,
                    # OR any restart (CrashLoopBackOff between failures).
                    if { [ -n "$EXIT_CODE" ] && [ "$EXIT_CODE" != "0" ]; } || \
                       { [ -n "$RESTARTS" ] && [ "$RESTARTS" -gt 0 ]; }; then
                      NOW=$(date +%s)
                      if [ -z "$FAILING_SINCE" ]; then
                        FAILING_SINCE=$NOW
                        echo "[scaler-up] gc failing (exit=${EXIT_CODE:-none} restarts=${RESTARTS:-0}) — holding registry down, 10m ceiling armed"
                      fi
                      if [ $((NOW - FAILING_SINCE)) -ge 600 ]; then
                        echo "[scaler-up] gc still failing after 10m — restoring registry and failing"
                        scale_up
                        exit 1
                      fi
                    fi
                    sleep 5
                  done
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: kuso-registry-data
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuso-registry-gc
  namespace: kuso
---
# Tightly-scoped — only what the GC job needs to scale the registry
# Deployment down and back up around the GC.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kuso-registry-gc
  namespace: kuso
rules:
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    resourceNames: [kuso-registry]
    verbs: [get, patch, update]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [list, watch]
  # The single-pod GC only waits on / reads pods (`kubectl wait`, `get
  # pod`); it never creates, deletes or reads logs of one.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    resourceNames: [kuso-registry-data]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kuso-registry-gc
  namespace: kuso
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kuso-registry-gc
subjects:
  - kind: ServiceAccount
    name: kuso-registry-gc
    namespace: kuso
---
# Registry access control (HIGH-4): the in-cluster registry is
# unauthenticated plain-HTTP, and we want to stop a tenant APPLICATION
# pod from reaching it to enumerate/pull/overwrite other projects' images
# (a cross-project tampering path).
#
# We deliberately do NOT put an ingress NetworkPolicy on the registry.
# On k3s (kube-router NetworkPolicy controller) a registry-ingress policy
# also blocks the KUBELET's image pull — the kubelet's connection to the
# registry ClusterIP is subject to the same per-node iptables rules and
# carries no pod identity the policy can allow. An ingress lock-down here
# therefore breaks every runtime pod with ImagePullBackOff ("connection
# refused" on :5000) and every build's push. (This regressed once — see
# the v0.22.x history — hence this explicit note.)
#
# The correct, CNI-agnostic control is on the EGRESS side, enforced
# per-pod: the project NetworkPolicy's allow-registry-egress rule is
# scoped to component=kusobuild pods only (see
# operator/helm-charts/kusoproject/templates/networkpolicy.yaml). A tenant
# app pod is not a build pod, so its egress to :5000 is denied by the
# project default-deny — it cannot reach the registry at all. Build pods
# and the buildkit daemon (a platform pod, unconstrained) still can, and
# kubelet pulls are untouched. That closes the tenant-pod path without the
# ingress policy's collateral damage.

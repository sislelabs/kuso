---
# ServiceAccount + RBAC for the kuso-server pod.
#
# Two-tier RBAC: a thin ClusterRole (kuso-server) with read-only verbs
# on Secrets cluster-wide so the shared informer can see addon conn
# Secrets in any project namespace; plus a Role (kuso-server-managed-ns)
# stamped into every managed namespace via RoleBinding for write +
# exec verbs. The home `kuso` ns gets the binding via the bootstrap
# step below; each new project ns gets one via EnsureNamespace.
#
# Honest post-RCE blast radius of this ServiceAccount (keep this list
# accurate when editing rules below — do not overclaim):
#   - READ every Secret in the cluster (required for the shared
#     informer to see addon conn Secrets in any project namespace).
#   - patch/delete any NODE (cordon/uncordon by nodewatch, label
#     editing, `kuso node remove` — inherently cluster-scoped verbs).
#   - delete any pod cluster-wide (drain/cleanup paths).
#   - patch/update FIVE named platform deployments in any namespace
#     (traefik, kuso-operator-controller-manager, cert-manager,
#     cert-manager-webhook, cert-manager-cainjector) — see the
#     resourceNames-scoped apps rule below.
#   - full workload mutation (Secrets writes, pods/exec, jobs/cronjobs,
#     serviceaccounts, deployments/statefulsets patch) ONLY inside
#     managed namespaces (home `kuso` + per-project namespaces) via
#     the kuso-server-managed-ns Role bindings.
# It can NOT create/patch workloads, Jobs, or ServiceAccounts in
# kube-system or any other namespace kuso doesn't manage.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kuso-server
  namespace: kuso
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kuso-server
rules:
  # Kuso CRDs we own. kusoes is the cluster-level install/config CRD
  # added in a recent release; without it kuso-server fails its
  # startup config-reload with "kusoes is forbidden" and never goes
  # ready. The kusoes/status subresource is included for symmetry —
  # the reconciler patches phase/conditions there.
  - apiGroups: [application.kuso.sislelabs.com]
    resources:
      [kusoprojects, kusoservices, kusoenvironments, kusoaddons,
       kusobuilds, kusocrons, kusoruns, kusoes]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [application.kuso.sislelabs.com]
    resources:
      [kusoprojects/status, kusoservices/status, kusoenvironments/status,
       kusoaddons/status, kusobuilds/status, kusocrons/status,
       kusoruns/status, kusoes/status]
    verbs: [get, update, patch]
  # Kube-native resources we read/write to manage tenants.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, patch]
  - apiGroups: [""]
    resources: [configmaps]
    # patch + delete were missing on releases through v0.11.1: the
    # in-cluster updater Job (kubectl apply on the kuso-update-status
    # ConfigMap) fails with Forbidden until both are granted, and the
    # progress-status writes during an in-place upgrade hard-fail with
    # 403. delete is granted so the updater can GC its old status CMs.
    verbs: [get, list, watch, create, update, patch, delete]
  # Secrets: read-only at cluster scope so the shared informer can
  # see addon conn Secrets across every project namespace. Writes
  # (create/update/patch/delete) live on the namespace-scoped Role
  # below (kuso-server-managed-ns), bound into each managed ns by
  # EnsureNamespace. An RCE on kuso-server can read Secrets cluster-
  # wide but cannot mutate them outside managed namespaces.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch]
  # serviceaccounts: read-only at cluster scope. The buildcontroller
  # creates one ServiceAccount per build Job (to gate the build pod's
  # identity for admission webhooks) but build Jobs only ever run in
  # managed namespaces, so the WRITE verbs live on the namespace-scoped
  # kuso-server-managed-ns Role below — a compromised server cannot
  # mint ServiceAccounts in kube-system.
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch, delete]
  # endpoints: the scale-to-zero activator (--activator mode, reusing
  # this ServiceAccount) gates "safe to proxy" on the target Service
  # having a ready endpoint, so it needs to read Endpoints cluster-wide.
  - apiGroups: [""]
    resources: [endpoints]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
  - apiGroups: [""]
    # delete: required by `kuso project delete --purge-data`, which wipes
    # each addon's data PVC for a clean-slate recreate. Without it the
    # purge path 403s ("cannot delete persistentvolumeclaims") and the
    # whole project-delete fails after the CRs are already gone.
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, create, delete]
  # nodes: patch + delete are genuinely needed CLUSTER-WIDE — nodes are
  # cluster-scoped objects, there is no narrower scope to grant. patch
  # backs nodewatch's auto-cordon/uncordon of NotReady nodes and the
  # labels editor (kuso.sislelabs.com/* placement labels); delete backs
  # `kuso node remove`. This is real post-RCE blast radius (a
  # compromised server can cordon or delete any node) and is accepted:
  # a node-managing control plane cannot function without it.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch, patch, delete]
  - apiGroups: [""]
    resources: [nodes/status]
    verbs: [get, list, watch]
  # pods/log: cluster-wide so the dashboard's log streamer can tail
  # any project pod. Read-only — log reads can't mutate cluster state.
  # pods/exec is intentionally NOT here; it lives on the namespace-
  # scoped Role below so kuso-server can only `kubectl exec` into
  # pods in managed namespaces (where addon repair runs psql ALTER
  # ROLE against postgres addon pods).
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list]
  # apps: read-only at cluster scope (status rollups + the shared
  # Deployment informer need to see workloads everywhere). Mutation
  # (patch/update for restarts, sleep/wake scaling, image rolls) lives
  # on the namespace-scoped kuso-server-managed-ns Role below, plus the
  # resourceNames-scoped exception right after this rule.
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch]
  # The ONE set of deployments kuso-server must mutate OUTSIDE managed
  # namespaces: the platform components it hardens (resource floors +
  # probes, internal/platformharden) and the operator image roll /
  # rollback (internal/updater). These live in fixed non-kuso
  # namespaces (traefik, kuso-operator-system, cert-manager) that
  # EnsureNamespace does not manage, so they're scoped by resourceNames
  # instead. Caveat, stated honestly: resourceNames are not
  # namespace-qualified, so this grants patch/update on any deployment
  # bearing one of these five names in ANY namespace — a far smaller
  # surface than the previous blanket cluster-wide grant, but not zero.
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames:
      - traefik
      - kuso-operator-controller-manager
      - cert-manager
      - cert-manager-webhook
      - cert-manager-cainjector
    verbs: [patch, update]
  # batch: read-only at cluster scope. Every Job/CronJob kuso-server
  # creates or deletes (build Jobs, backup + restore Jobs, updater Jobs,
  # preview-DB clones, run executions, incident agents, stale-Job
  # cleanup) lives in a managed namespace, so the write verbs are on the
  # kuso-server-managed-ns Role below. Side effect, by design: the
  # admin "cleanup" sweep can no longer delete finished Jobs in
  # namespaces kuso doesn't manage (those now surface as per-item
  # errors) — kuso has no business reaping other operators' Jobs.
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch]
  # Leader election. Singleton background workers (build poller,
  # alert engine, nodewatch, daily cleanup) contest a Lease lock so
  # exactly one kuso-server pod runs them at a time. Without these
  # verbs the leader-election helper falls back to "always run" and
  # multi-replica deploys double-promote builds + double-fire alerts.
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch]
  - apiGroups: [helm.cattle.io]
    resources: [helmcharts]
    verbs: [get, list, watch]
  # CRDs: the in-cluster updater Job (kuso upgrade) applies the
  # crds.yaml shipped with each release so schema additions (new
  # fields on KusoService/KusoEnvironment/etc.) reach the cluster
  # without a manual install step. Without these verbs every upgrade
  # past v0.11.0 fails with `customresourcedefinitions is forbidden`
  # at the kubectl-apply preflight step. Get + create + update +
  # patch are the minimum for `kubectl apply` against an existing
  # CRD; list/watch let the updater see what's already installed
  # before deciding what to add.
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch, create, update, patch]
  # Metrics for the per-node sparkline + alert engine.
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list]
  # RBAC: kuso-server creates per-project RoleBindings at
  # EnsureNamespace time so it can mutate Secrets + exec into addon
  # pods inside the project namespace. get + list let the stamper
  # check idempotence; create lets it land the binding. delete/patch
  # are NOT granted — once stamped, bindings are immutable from the
  # server's view (project deletion drops the whole namespace, which
  # cascades to the binding).
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings]
    verbs: [get, list, create]
  # `bind` on the managed-ns ClusterRole. Kubernetes privilege-escalation
  # prevention forbids a subject from creating a RoleBinding that grants
  # permissions it does not itself hold — and kuso-server deliberately
  # does NOT hold pods/exec, pods/portforward, or secret WRITES cluster-
  # wide (those are namespace-scoped to limit RCE blast radius). So when
  # EnsureNamespace tries to stamp the managed-ns binding into a brand-new
  # project namespace, the API server rejects it as an escalation attempt
  # ("attempting to grant RBAC permissions not currently held"). The
  # standard escape hatch is the `bind` verb, scoped by resourceNames to
  # the ONE ClusterRole we bind — this authorises the binding without
  # granting kuso-server those permissions everywhere. Without this, every
  # custom-namespace (i.e. every new) project failed to create.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles]
    resourceNames: [kuso-server-managed-ns]
    verbs: [bind]
  # The in-cluster updater Job applies dist/upgrade-manifests.yaml on
  # every release. That bundle carries the RBAC for the platform's own
  # helper workloads (kuso-pkg-probe, kuso-prometheus,
  # kuso-incident-agent, kuso-postgres-dsn), so applying it needs
  # get/create/update/patch on roles + cluster(role|rolebinding)s.
  # Without these, six manifests fail `Forbidden` on EVERY upgrade and
  # the updater reports "applying-manifests — partial": the image roll
  # still succeeds, so the failure is easy to miss, but any NEW helper
  # RBAC never lands and the feature depending on it silently doesn't
  # work.
  #
  # Kubernetes privilege-escalation prevention means a subject can only
  # create RBAC granting permissions it already holds itself, so this
  # is not a blank cheque — kuso-server can only stamp roles that are a
  # subset of the rules above. `services` (list/watch) is added below
  # for the same reason: it's the one permission kuso-prometheus's
  # ClusterRole grants that kuso-server did not already have, so the
  # apply was rejected as an escalation attempt.
  #
  # rolebindings repeats the resource named above deliberately: the
  # per-project rule intentionally withholds update/patch (once stamped,
  # a project binding is immutable from the server's view), but
  # `kubectl apply` over an EXISTING RoleBinding in the bundle needs
  # them. RBAC rules are additive — the union is what applies — so
  # listing it here grants the updater's re-apply without rewriting the
  # narrower rule's intent.
  #
  # SCOPING: update/patch on CLUSTER-scoped RBAC is restricted by
  # resourceNames to the exact objects the upgrade bundle owns. K8s
  # escalation-prevention already stops kuso-server from granting more
  # than it holds, so this was never a blank cheque — but an unscoped
  # `patch clusterroles` still let a compromised server REWRITE any
  # existing ClusterRole in the cluster (including ones belonging to
  # other operators), which is a much larger blast radius than
  # re-applying its own bundle. Namespaced roles/rolebindings stay
  # unscoped: they're per-project and created on demand, so their names
  # aren't knowable ahead of time, and they're already bounded to
  # namespaces kuso manages.
  #
  # `create` is listed separately because Kubernetes IGNORES
  # resourceNames on create (the name isn't known at admission time) —
  # a rule that mixes create with resourceNames silently grants nothing.
  # Adding a new cluster-scoped RBAC object to deploy/ means adding its
  # name to the list below, or the upgrade will report
  # "applying-manifests — partial".
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, create, update, patch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [get, list, create]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings]
    verbs: [update, patch]
    resourceNames:
      - kuso-server
      - kuso-server-managed-ns
      - kuso-operator
      - kuso-prometheus
      - kuso-pkg-probe
      - kuso-incident-agent
  # PodDisruptionBudgets ship with the pgbouncer/prometheus manifests
  # so a drain can't take out the last replica. PriorityClasses come
  # with the same bundle (control-plane workloads preempt tenant pods
  # under node pressure).
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, create, update, patch]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [get, list, create, update, patch]
  # NetworkPolicies: the bundle ships the default-deny + platform-API
  # egress policies that back `--platform-api-egress`.
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, create, update, patch]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kuso-server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kuso-server
subjects:
  - kind: ServiceAccount
    name: kuso-server
    namespace: kuso
---
# Namespace-scoped Role for the write verbs that don't belong cluster-
# wide. Every managed namespace (home `kuso` + each project ns) gets a
# RoleBinding to this Role. EnsureNamespace stamps the binding for new
# project namespaces; the bootstrap RoleBinding below covers the home
# `kuso` ns. The ClusterRole template is referenced by RoleBinding (not
# Role) so we keep one canonical definition.
#
# UPGRADE CAVEAT: whenever a release ADDS rules to this ClusterRole,
# the self-updater cannot apply the change — Kubernetes privilege-
# escalation prevention rejects a subject updating a (Cluster)Role to
# include permissions it doesn't hold cluster-wide, and kuso-server
# deliberately holds these verbs only per-namespace. The updater
# reports "applying-manifests — partial" and a cluster-admin must
# re-apply this manifest once:
#   kubectl apply -f deploy/server-go.yaml
# (Same one-time step the pods/portforward addition needed.)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kuso-server-managed-ns
rules:
  # Secret writes — addon conn Secrets, per-service Secrets, GitHub
  # clone-token Secrets, kuso-server-secrets in the home ns. Scope:
  # ONLY the managed namespace this Role is bound into.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [create, update, patch, delete]
  # pods/exec: addons.repair execs into postgres addon pods to push
  # password resyncs via psql ALTER ROLE. Strictly namespace-scoped
  # to managed project namespaces.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  # pods/portforward: `kuso db connect` / `db port-forward` front the
  # kube pods/portforward subresource so an operator can reach an addon
  # (postgres/redis/mongo) from their laptop without exposing it
  # publicly. Same namespace scope and rationale as pods/exec above —
  # without it the tunnel dial is rejected ("cannot create
  # pods/portforward") and the data stream fails mid-handshake.
  - apiGroups: [""]
    resources: [pods/portforward]
    verbs: [create]
  # services (read): node-bootstrap looks up the in-cluster registry
  # Service ClusterIP so a joining node can be wired to pull build
  # images. Read-only, namespace-scoped.
  - apiGroups: [""]
    resources: [services]
    verbs: [get, list]
  # serviceaccounts: the in-process buildcontroller creates one
  # ServiceAccount per build Job to gate the build pod's identity for
  # admission webhooks (Kyverno/OPA/PSA); the updater bundle re-applies
  # the platform SAs in the home ns. Build Jobs and platform SAs only
  # exist in managed namespaces, so the write verbs live here — NOT on
  # the cluster-wide role (an RCE must not be able to mint SAs in
  # kube-system).
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [create, update, patch, delete]
  # apps mutation: rollout-restart + sleep/wake scaling of service
  # deployments (activator, scaledown), image stamps, addon
  # StatefulSet nudges, and `kubectl set image deployment/kuso-server`
  # from the updater Job. All targets live in managed namespaces; the
  # only out-of-namespace exception is the resourceNames-scoped
  # platform-deployment rule on the cluster role above.
  # statefulsets delete: remediate.orphanRecreate deletes an addon's
  # orphaned StatefulSet (owner-ref GC churn / helm-upgrade-wedge class)
  # so the operator recreates it cleanly — a managed-ns addon workload,
  # so delete is scoped here, not cluster-wide. UPGRADE CAVEAT: adding a
  # verb to this managed-ns Role can't be self-applied (the server can't
  # escalate its own RBAC); it needs a one-time `kubectl apply` of this
  # manifest, same as the pods/portforward addition.
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [patch, update]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [delete]
  # batch mutation: build Jobs (buildcontroller), backup/restore Jobs,
  # updater Jobs, preview-DB clone Jobs, run executions, incident-agent
  # Jobs, and the stale-Job cleanup sweep. Everything kuso creates runs
  # in a managed namespace.
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [create, update, patch, delete]
---
# Bootstrap binding for the home `kuso` namespace. New project
# namespaces get their RoleBinding created by EnsureNamespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kuso-server-managed-ns
  namespace: kuso
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kuso-server-managed-ns
subjects:
  - kind: ServiceAccount
    name: kuso-server
    namespace: kuso
---
# kuso-platform priority class — every long-lived control-plane pod
# (kuso-server, kuso-operator, traefik, cert-manager) declares this
# so the kubelet can never evict them in favour of a workload pod.
# Build pods, addons, user services keep the default priority. When
# the node runs hot, the kubelet picks the lowest-priority pod to
# evict, which is now always something the user can tolerate losing.
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: kuso-platform
value: 100000
globalDefault: false
description: "kuso control-plane pods. Survives workload eviction."
---
# PodDisruptionBudget keeps voluntary evictions (kubectl drain, the
# k3s upgrade controller, cluster-autoscaler) from yanking the
# kuso-server pod. The cost: drain on the control-plane node will
# wait until a human moves on. The benefit: dashboards stay up
# through routine cluster maintenance.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kuso-server
  namespace: kuso
  annotations:
    # Single-replica installs: this PDB will block `kubectl drain`
    # until you scale kuso-server to 2+ replicas. Either:
    #   - kubectl -n kuso scale deploy/kuso-server --replicas=2
    #   - kubectl -n kuso delete pdb kuso-server   # uncordon yourself
    # Multi-replica installs: drain works as expected (PDB allows
    # one disruption while keeping the second pod up).
    kuso.sislelabs.com/single-replica-drain-hint: "scale to 2+ replicas OR delete this PDB before draining the only kuso-server node"
spec:
  # maxUnavailable=1 instead of minAvailable=1 means: tolerate one
  # voluntarily-evicted pod at any moment. On a single-replica
  # deployment this still blocks drain (1 pod can't be 1 unavail
  # AND remain up), but the annotation above tells the operator
  # exactly what to do. On multi-replica it's strictly better than
  # minAvailable=1 because it scales: a 5-replica deploy lets node
  # maintenance roll one host at a time without per-host knob fiddling.
  maxUnavailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kuso-server }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kuso-server
  namespace: kuso
  labels:
    app.kubernetes.io/name: kuso-server
spec:
  # Default 1 replica for indie installs. HA is supported — bump
  # this to 2+ on multi-node clusters by running:
  #
  #   kubectl scale deployment kuso-server -n kuso --replicas=2
  #
  # What's already HA-safe:
  #   - Postgres backend (deploy/postgres.yaml or external managed DB)
  #   - JWT signing key in kube Secret kuso-server-secrets
  #   - Leader-elected singletons (build poller, alert engine,
  #     nodewatch, nodemetrics, audit trim) on Lease objects
  #     kuso-server-singletons + kuso-server-cluster-singletons
  #   - Stateless HTTP handlers (JWT auth, no server-side session)
  #
  # Caveats at >1 replica:
  #   - In-process query caches are per-pod (5-10s stale window
  #     after a write hits pod A but pod B serves the next read —
  #     correctness preserved, just briefly stale UI)
  #   - Per-user WebSocket slot caps are per-pod, so a single user
  #     can hit maxWSPerUser × N pods worth of streams
  #   - WebSocket reconnects on pod failover (acceptable for log
  #     tails; the next frame is the current tail anyway)
  #   - The DB connection pool is PER POD: each replica opens up to
  #     KUSO_DB_MAX_CONNS (default 25). Fleet total = that × replicas,
  #     so 4 replicas exhausts Postgres's default max_connections of
  #     100 and new sessions — including the operator's and your own
  #     psql — start failing with "too many clients already". Past 2
  #     replicas either raise max_connections or lower
  #     KUSO_DB_MAX_CONNS so the product stays under ~60% of it.
  #
  # The DB still needs to be HA on its own — point KUSO_DB_DSN at a
  # managed Postgres (RDS / Crunchy / Supabase) when running >1
  # kuso-server pod, since deploy/postgres.yaml is a single-instance
  # StatefulSet pinned to the control-plane node.
  replicas: 1
  # RollingUpdate replaces the pre-v0.9 Recreate strategy. The RWO
  # PVC was the only reason for Recreate; with Postgres there's no
  # shared-state file, so a new pod can come up while the old one
  # drains. maxUnavailable=0 keeps the dashboard always reachable
  # during a roll.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: { app.kubernetes.io/name: kuso-server }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kuso-server }
      # Opt in to the in-cluster Prometheus's pod-discovery scrape.
      # Picked up by the `kubernetes-pods` job in deploy/prometheus.yaml
      # via the prometheus.io/scrape="true" relabel rule. /metrics is
      # mounted by the chi router on port 8080 (the same port the
      # service listens on); no extra Service needed because the
      # scrape goes pod-to-pod.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: kuso-server
      # Highest-priority class on the cluster — see PriorityClass
      # above. Lets the kubelet pick a workload pod to evict before
      # it ever touches kuso-server when memory pressure hits.
      priorityClassName: kuso-platform
      # No nodeSelector — kuso-server is now schedulable on worker
      # nodes. The k3s node-token used to require a hostPath mount on
      # the control-plane, but install.sh now writes the token to a
      # kube Secret (kuso-k3s-token) and mounts it via envFrom on
      # every replica. Single-node installs land on whatever node is
      # available; multi-replica installs spread across the cluster.
      tolerations:
        # Keep this so the pod CAN land on the control-plane node in
        # single-node installs (k3s control-plane has the
        # NoSchedule taint applied by default).
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # Anti-affinity: when running multi-replica, prefer to spread
      # across nodes. Soft preference (ScheduleAnyway via
      # preferredDuringScheduling) so single-node clusters still
      # schedule both pods on the same host.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kuso-server
      # 60s gives the graceful-shutdown path room to let in-flight
      # requests finish + close websocket connections (logs
      # streamer). Postgres connections close fast; the bound is
      # the slow HTTP work, not DB.
      terminationGracePeriodSeconds: 60
      containers:
        - name: server
          image: ghcr.io/sislelabs/kuso-server-go:v0.23.0
          imagePullPolicy: IfNotPresent
          # Burstable QoS. Setting requests below limits puts us in
          # Burstable — survives host pressure without pre-allocating
          # capacity we won't use 95% of the time.
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 1000m
              memory: 768Mi
          ports:
            - { containerPort: 3000, name: http }
          env:
            - { name: KUSO_HTTP_ADDR, value: ":3000" }
            # Postgres DSN. The install script + the kuso-postgres-
            # dsn-stamp Job (deploy/postgres.yaml) compose this and
            # write it into the kuso-postgres-conn Secret. By default
            # the DSN points at kuso-pgbouncer:6432 (transaction
            # pooler) when PgBouncer is present, falling back to
            # kuso-postgres-rw:5432 otherwise. Deploy-only installs
            # bringing their own Postgres / pooler can replace this
            # with their own valueFrom.
            - name: KUSO_DB_DSN
              valueFrom:
                secretKeyRef:
                  name: kuso-postgres-conn
                  key: dsn
            - { name: KUSO_NAMESPACE, value: kuso }
            - { name: KUSO_ADMIN_USERNAME, value: admin }
            - { name: KUSO_ADMIN_EMAIL, value: admin@example.com }
            # Admin password is now sourced from a mounted file (see
            # volumeMounts below) instead of the envFrom-loaded
            # kuso-server-secrets. The file path is read on first
            # boot only — see cmd/kuso-server/admin_password.go.
            # The env-var path still works as a fallback for
            # backwards-compat with older installs that haven't
            # re-run install.sh.
            - { name: KUSO_ADMIN_PASSWORD_FILE, value: /etc/kuso/admin/password }
            - { name: KUSO_AUDIT, value: "true" }
            - { name: KUSO_TEMPLATES_ENABLED, value: "false" }
          envFrom:
            - secretRef: { name: kuso-server-secrets }
            - secretRef: { name: kuso-github-app, optional: true }
            # k3s server node-token, required to issue agent-join
            # commands. install.sh writes this Secret on initial
            # install (key: token); kuso-server reads
            # KUSO_K3S_TOKEN before falling back to the hostPath
            # mount below. optional=true so existing installs that
            # haven't been re-installed since v0.9.36 keep working.
            - secretRef: { name: kuso-k3s-token, optional: true }
          # PreStop fires AFTER the pod is marked Terminating but
          # BEFORE SIGTERM. Sleeping here gives the kube-proxy /
          # ingress controller time to remove this pod from their
          # endpoint pool. 15s — traefik can take up to 10s to
          # drain endpoint state under load.
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          # Liveness checks the process is up — /healthz is cheap and
          # never touches DB. The one exception: a LEADER whose build
          # poller heartbeat has been silent > 5min reports 503, so a
          # hard-wedged singleton loop gets restarted and releases the
          # lease (readiness failure alone drains the LB but never
          # restarts a pod — a wedged replicas=1 leader used to hold
          # the lease forever). With period 30s x failureThreshold 6
          # the restart lands ~3min after /healthz starts failing,
          # ~8min after the poller's last beat — a briefly-slow tick
          # can never trip it. Readiness checks dependencies via
          # /readyz (Postgres ping + kube informer cache synced +
          # poller beat < 30s stale) so the LB drains a pod whose DB
          # connection is broken instead of silently 5xx-ing every
          # request. Tolerant config absorbs noisy-neighbor CPU
          # starvation without killing the pod: 3min liveness grace,
          # 1min readiness grace.
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            # Up to 90s for first-boot to absorb Postgres connection
            # ping retries (the pod may start before postgres is
            # fully up on a fresh install) plus kube informer
            # restoration. Uses /readyz so we wait for cache sync
            # before serving any traffic.
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            failureThreshold: 18
          volumeMounts:
            # Admin bootstrap password projected as a file. Kept off
            # the env so `kubectl exec` / `describe pod` doesn't
            # surface it. Marked optional so OAuth-only installs
            # (no password admin) start without complaint.
            - name: admin-credentials
              mountPath: /etc/kuso/admin
              readOnly: true
      volumes:
        - name: admin-credentials
          secret:
            secretName: kuso-admin-credentials
            optional: true
            # 0444 not 0400: the kuso-server container runs as the non-root
            # `kuso` user (Dockerfile `USER kuso`), and projected secrets
            # are owned by root:root. With 0400 only root can read the
            # file — the kuso user gets EACCES, readAdminPassword() logs
            # "permission denied" and skips first-boot admin bootstrap,
            # leaving no admin user in the DB. 0444 makes the password
            # world-readable inside the pod (still scoped to the mount,
            # still single-tenant, still in-cluster).
            defaultMode: 0444
            items:
              - key: password
                path: password
      # k3s node-token used to be a hostPath
      # of /var/lib/rancher/k3s/server/node-token, which pinned the
      # pod to the control-plane node. Now KUSO_K3S_TOKEN is sourced
      # from the kuso-k3s-token Secret (envFrom above), so the pod
      # can run anywhere. install.sh creates that Secret at install
      # time by reading the node-token from the host. Existing
      # installs that haven't been re-installed since v0.9.36 keep
      # working via the hostPath fallback in nodejoin.ReadServerToken
      # — but only on the control-plane node.

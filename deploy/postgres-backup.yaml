---
# Off-cluster backup of kuso-postgres (the control-plane DB).
#
# Why this is critical: the in-cluster kuso-postgres StatefulSet is the
# single source of truth for users, audit logs, notification configs,
# build metadata, the github-app installation map, addon connection
# secrets, and node-bootstrap tokens. Lose its PVC and every project
# in the cluster orphans. Addon backups (handlers/backups.go) only
# cover user databases — the kuso DB itself was never being backed up
# until this CronJob.
#
# Strategy: pg_dump every hour to S3-compatible object storage. Keeps
# 24 hourly + 7 daily + 12 monthly snapshots. The schedule is opt-in
# via the kuso-postgres-backup Secret — every secretKeyRef below is
# optional:true, and the job exits 0 with a "not configured" log line
# when the Secret is absent/incomplete rather than failing loudly.
# The backup-health banner (internal/backuphealth) reads Secret
# presence, so operators still get nagged to configure it.
#
# Two containers so no tooling is installed at runtime (the pod runs
# as uid 999 with all capabilities dropped — apt-get/installers can't
# work, and shouldn't):
#   initContainer dump   (postgres:16-bookworm)  pg_dump → gzip → emptyDir (validated before handoff)
#   container    upload  (amazon/aws-cli)        aws s3 cp ← emptyDir
#
# Restore: `kuso restore <file>` (POST /api/admin/restore) takes these
# dumps as they are, encrypted or not; see docs/BACKUP_RESTORE.md.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kuso-postgres-backup
  namespace: kuso
  labels:
    app.kubernetes.io/name: kuso-postgres-backup
spec:
  # Daily at 23:00 UTC — late enough to catch a full day's changes,
  # and clear of the addon backup window (01:00-06:00) so the two
  # don't contend for disk and network. RPO of a day for the control
  # plane: it is config/metadata (projects, services, env vars, build
  # history), not user data, and it changes in bursts around deploys
  # rather than continuously. Addon backups cover the actual databases.
  schedule: "0 23 * * *"
  # Don't pile up Jobs if a previous one is still running (e.g. slow
  # S3 upload during a network blip).
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 5
  startingDeadlineSeconds: 600
  jobTemplate:
    spec:
      # Matches the addon backup CronJobs. Each run writes its own
      # timestamped key, so a retry is idempotent and costs only time —
      # and this is the CONTROL-PLANE database, where losing a night's
      # backup to one transient blip is the worst case on the cluster.
      backoffLimit: 3
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: kuso-postgres-backup
        spec:
          restartPolicy: OnFailure
          # Pin to the same node as Postgres — the dump streams over
          # localhost between containers but kube-scheduling still
          # decides the node, so this keeps egress local on a single-
          # box install.
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          volumes:
            - name: workdir
              emptyDir: {}
          initContainers:
            - name: dump
              # postgres image carries pg_dump. It only writes to the
              # shared emptyDir — no runtime package installs (the pod
              # runs non-root with all caps dropped; apt-get can't work).
              image: postgres:16-bookworm
              command: ["/bin/bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  # Opt-in gate: without a complete kuso-postgres-backup
                  # Secret this is a documented no-op (exit 0), not a
                  # failure. The backup-health banner keeps nagging the
                  # operator until the Secret exists.
                  if [ -z "${KUSO_BACKUP_BUCKET:-}" ] || [ -z "${KUSO_BACKUP_ENDPOINT:-}" ] \
                     || [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${AWS_SECRET_ACCESS_KEY:-}" ]; then
                    echo "backup not configured (kuso-postgres-backup Secret missing or incomplete) — skipping"
                    exit 0
                  fi

                  TS=$(date -u +%Y%m%dT%H%M%SZ)
                  RAW="/backup/kuso-${TS}.sql"
                  DUMP="/backup/kuso-${TS}.sql.gz"

                  # Dump to a plain file FIRST, no pipeline. The old
                  # `pg_dump | gzip > $DUMP` shape (under bash -eu, NO
                  # pipefail) meant a failing pg_dump still left gzip
                  # exiting 0: the Job went green and a tiny valid-gzip
                  # garbage artifact OVERWROTE the retention slot — within
                  # a day/week every good backup was destroyed while
                  # backup-health stayed green (it counts Job success).
                  # With a plain redirect, `set -e` makes a pg_dump
                  # failure abort right here — before meta.env exists —
                  # so the upload container no-ops and the prior good
                  # backup in the slot survives.
                  echo "dumping kuso DB → $DUMP"
                  # LogLine keeps its schema and id sequence but no rows:
                  # it is budget-pruned throwaway data, and at its byte
                  # budget it was GBs of text per night. -and-children
                  # also covers the daily partitions (pg_dump 16+).
                  # --clean --if-exists: the restore API loads the dump over
                  # a live schema (boot always creates every table), which
                  # only works when the dump drops each object first.
                  pg_dump --format=plain --no-owner --no-privileges \
                    --clean --if-exists \
                    --quote-all-identifiers \
                    --exclude-table-data-and-children='"LogLine"' \
                    "$KUSO_DB_DSN" > "$RAW"
                  gzip -9 "$RAW" # produces $DUMP, removes $RAW

                  SIZE=$(stat -c%s "$DUMP")
                  echo "dump size: $SIZE bytes"

                  # Sanity floor: the control-plane DB always carries the
                  # full kuso schema (users, builds, audit, settings, …),
                  # so even a fresh install's dump never gzips down to a
                  # few hundred bytes — but a failed/truncated dump does
                  # (pg_dump's preamble alone gzips to ~300 bytes). An
                  # implausibly small artifact is garbage: refuse to hand
                  # it to the upload container so the Job fails visibly
                  # and the retention slots keep the last good backup.
                  MIN_BYTES=4096
                  if [ "$SIZE" -lt "$MIN_BYTES" ]; then
                    echo "ERROR: dump implausibly small (${SIZE} bytes < ${MIN_BYTES} floor) — refusing to upload" >&2
                    exit 1
                  fi
                  # Integrity: the archive must decompress cleanly end to
                  # end before we let it near a retention slot.
                  gzip -t "$DUMP"

                  # The dump holds SSH keys, OAuth tokens and TOTP seeds, so
                  # it leaves the cluster encrypted, in the same openssl
                  # format as addon dumps. kuso-server creates the key
                  # Secret; `kuso backup keys export` escrows it and
                  # `kuso restore` decrypts with it. Without the Secret
                  # (an older server) the dump goes up as before.
                  ENC=""
                  if [ -n "${BACKUP_ENCRYPTION_KEY:-}" ]; then
                    openssl enc -aes-256-cbc -pbkdf2 -iter 100000 -md sha256 -salt \
                      -pass env:BACKUP_ENCRYPTION_KEY -in "$DUMP" -out "$DUMP.enc"
                    mv "$DUMP.enc" "$DUMP"
                    SIZE=$(stat -c%s "$DUMP")
                    ENC="openssl-aes-256-cbc-pbkdf2-sha256"
                  else
                    echo "WARNING: kuso-controlplane-backup-key Secret missing; uploading the dump UNENCRYPTED" >&2
                  fi

                  # Hand off to the upload container. Retention slot keys
                  # are computed HERE so dump + upload agree on the hour
                  # even if the pod straddles a boundary between containers.
                  #
                  # Built with explicit echo redirects, NOT a heredoc: this
                  # script is embedded in a YAML block scalar, and a heredoc's
                  # closing delimiter only terminates when it sits at the
                  # shell's column 0. YAML strips the block's common leading
                  # indent, so an indented `META` terminator lands at column 0
                  # ONLY as long as every line shares the exact same indent —
                  # a brittle coupling. If the closing token ever drifts (or a
                  # non-spec YAML tool processes this), the literal delimiter
                  # gets captured into meta.env, the upload container sources
                  # it, hits `META: command not found`, and exits 127 under
                  # `set -e` BEFORE any `aws s3 cp` — zero bytes to S3, every
                  # run, silently. Echo redirects have no terminator and no
                  # indentation dependency, so that whole failure class is gone.
                  {
                    echo "TS=$TS"
                    echo "HOUR=$(date -u +%H)"
                    echo "DOW=$(date -u +%u)"
                    echo "DOM=$(date -u +%d)"
                    echo "MONTH=$(date -u +%m)"
                    echo "SIZE=$SIZE"
                    echo "DUMP=$DUMP"
                    echo "ENC=$ENC"
                  } > /backup/meta.env
              env:
                # DSN of the kuso DB — same Secret kuso-server consumes,
                # so credential rotation flows through automatically.
                - name: KUSO_DB_DSN
                  valueFrom:
                    secretKeyRef:
                      name: kuso-postgres-conn
                      key: dsn
                # S3 target config is read here ONLY for the opt-in
                # gate; the upload container consumes it for real.
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: kuso-postgres-backup, key: AWS_ACCESS_KEY_ID, optional: true }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: kuso-postgres-backup, key: AWS_SECRET_ACCESS_KEY, optional: true }
                - name: KUSO_BACKUP_BUCKET
                  valueFrom:
                    secretKeyRef: { name: kuso-postgres-backup, key: KUSO_BACKUP_BUCKET, optional: true }
                - name: KUSO_BACKUP_ENDPOINT
                  valueFrom:
                    secretKeyRef: { name: kuso-postgres-backup, key: KUSO_BACKUP_ENDPOINT, optional: true }
                - name: BACKUP_ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef: { name: kuso-controlplane-backup-key, key: key, optional: true }
              volumeMounts:
                - { name: workdir, mountPath: /backup }
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 999
                runAsGroup: 999
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: [ALL]
          containers:
            - name: upload
              # Official image already carries the aws CLI — nothing to
              # install at runtime. Pinned for reproducibility.
              image: amazon/aws-cli:2.39.6
              command: ["/bin/sh", "-eu", "-c"]
              args:
                - |
                  if [ ! -f /backup/meta.env ]; then
                    echo "nothing to upload — backup not configured (see dump container log)"
                    exit 0
                  fi
                  . /backup/meta.env
                  DEST_PREFIX="${KUSO_BACKUP_PREFIX:-kuso-postgres}"

                  # Daily retention: 30 slots, keyed by day-of-month.
                  # On a daily schedule this is the primary slot — every
                  # run lands here and a slot is overwritten once a month.
                  # (Was hourly/${HOUR} when this ran every hour; with a
                  # 03:00 schedule an hour-keyed slot would only ever fill
                  # one of its 24 slots.)
                  DAILY="${DEST_PREFIX}/daily/${DOM}.sql.gz"
                  aws s3 cp "$DUMP" "s3://${KUSO_BACKUP_BUCKET}/${DAILY}" \
                    --endpoint-url "$KUSO_BACKUP_ENDPOINT" \
                    --metadata "kuso-ts=$TS,kuso-size=$SIZE,kuso-encryption=${ENC:-none}"

                  # Weekly retention: 7 slots, keyed by UTC weekday. Gives
                  # a second, slower-rotating copy so a bad dump that
                  # overwrites today's daily slot doesn't leave a hole.
                  WEEKLY="${DEST_PREFIX}/weekly/${DOW}.sql.gz"
                  aws s3 cp "$DUMP" "s3://${KUSO_BACKUP_BUCKET}/${WEEKLY}" \
                    --endpoint-url "$KUSO_BACKUP_ENDPOINT" \
                    --metadata "kuso-ts=$TS,kuso-size=$SIZE,kuso-encryption=${ENC:-none}"

                  # Monthly retention: 12 slots, keyed by month. Written
                  # on the 1st, whatever hour the daily schedule runs at.
                  if [ "$DOM" = "01" ]; then
                    MONTHLY="${DEST_PREFIX}/monthly/${MONTH}.sql.gz"
                    aws s3 cp "$DUMP" "s3://${KUSO_BACKUP_BUCKET}/${MONTHLY}" \
                      --endpoint-url "$KUSO_BACKUP_ENDPOINT" \
                      --metadata "kuso-ts=$TS,kuso-size=$SIZE,kuso-encryption=${ENC:-none}"
                  fi

                  echo "backup complete"
              env:
                # HOME must be writable for the aws CLI's config/cache.
                - name: HOME
                  value: /tmp
                # aws-cli >= 2.23 adds x-amz-checksum-* headers to every
                # upload by default; Hetzner Object Storage and Backblaze
                # B2 reject them. when_required is harmless on AWS S3.
                - name: AWS_REQUEST_CHECKSUM_CALCULATION
                  value: when_required
                - name: AWS_RESPONSE_CHECKSUM_VALIDATION
                  value: when_required
                # S3-compatible target. The kuso-postgres-backup Secret
                # is operator-supplied; all refs optional so the CronJob
                # no-ops (never errors) until it exists. Set up via:
                #
                #   kubectl create secret generic kuso-postgres-backup \
                #     -n kuso \
                #     --from-literal=AWS_ACCESS_KEY_ID=... \
                #     --from-literal=AWS_SECRET_ACCESS_KEY=... \
                #     --from-literal=KUSO_BACKUP_BUCKET=kuso-backups \
                #     --from-literal=KUSO_BACKUP_ENDPOINT=https://s3.eu-central-1.amazonaws.com \
                #     --from-literal=KUSO_BACKUP_PREFIX=hetzner-prod
                #
                # Works with AWS S3, Backblaze B2, Cloudflare R2,
                # Hetzner Object Storage, MinIO — anything with the
                # AWS S3 API.
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef: { name: kuso-postgres-backup, key: AWS_ACCESS_KEY_ID, optional: true }
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef: { name: kuso-postgres-backup, key: AWS_SECRET_ACCESS_KEY, optional: true }
                - name: KUSO_BACKUP_BUCKET
                  valueFrom:
                    secretKeyRef: { name: kuso-postgres-backup, key: KUSO_BACKUP_BUCKET, optional: true }
                - name: KUSO_BACKUP_ENDPOINT
                  valueFrom:
                    secretKeyRef: { name: kuso-postgres-backup, key: KUSO_BACKUP_ENDPOINT, optional: true }
                - name: KUSO_BACKUP_PREFIX
                  valueFrom:
                    secretKeyRef:
                      name: kuso-postgres-backup
                      key: KUSO_BACKUP_PREFIX
                      optional: true
                - name: AWS_DEFAULT_REGION
                  valueFrom:
                    secretKeyRef:
                      name: kuso-postgres-backup
                      key: AWS_DEFAULT_REGION
                      optional: true
              volumeMounts:
                - { name: workdir, mountPath: /backup }
              resources:
                requests:
                  cpu: 100m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                runAsNonRoot: true
                runAsUser: 999
                runAsGroup: 999
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                capabilities:
                  drop: [ALL]

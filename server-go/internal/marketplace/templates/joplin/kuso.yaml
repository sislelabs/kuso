apiVersion: kuso/v1
project: joplin
services:
  - name: joplin
    runtime: image
    port: 22300
    image:
      repository: joplin/server
      tag: "3.7.4"
    env:
      APP_BASE_URL: "https://${{ prompt.host }}"
      APP_PORT: "22300"
      DB_CLIENT: pg
      POSTGRES_HOST: "${{ joplin-db.POSTGRES_HOST }}"
      POSTGRES_PORT: "${{ joplin-db.POSTGRES_PORT }}"
      POSTGRES_USER: "${{ joplin-db.POSTGRES_USER }}"
      POSTGRES_PASSWORD: "${{ joplin-db.POSTGRES_PASSWORD }}"
      POSTGRES_DATABASE: "${{ joplin-db.POSTGRES_DB }}"
    domains:
      - host: "${{ prompt.host }}"
        tls: true
addons:
  - name: joplin-db
    kind: postgres
    version: "16"

apiVersion: kuso/v1
project: gotify
services:
  - name: gotify
    runtime: image
    port: 8080
    image:
      repository: gotify/server
      tag: "2.9.1"
    env:
      GOTIFY_SERVER_PORT: "8080"
      GOTIFY_DEFAULTUSER_NAME: admin
      GOTIFY_DEFAULTUSER_PASS: { generate: hex16 }
    domains:
      - host: "${{ prompt.host }}"
        tls: true
    volumes:
      - name: data
        mountPath: /app/data
        sizeGi: 1
    scale: { min: 1, max: 1 }

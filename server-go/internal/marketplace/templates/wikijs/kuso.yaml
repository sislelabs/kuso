apiVersion: kuso/v1
project: wikijs
services:
  - name: wikijs
    runtime: image
    port: 3000
    image:
      repository: ghcr.io/requarks/wiki
      tag: "2.5.314"
    env:
      DB_TYPE: postgres
      DB_HOST: "${{ wikijs-db.POSTGRES_HOST }}"
      DB_PORT: "${{ wikijs-db.POSTGRES_PORT }}"
      DB_USER: "${{ wikijs-db.POSTGRES_USER }}"
      DB_PASS: "${{ wikijs-db.POSTGRES_PASSWORD }}"
      DB_NAME: "${{ wikijs-db.POSTGRES_DB }}"
    domains:
      - host: "${{ prompt.host }}"
        tls: true
addons:
  - name: wikijs-db
    kind: postgres
    version: "16"

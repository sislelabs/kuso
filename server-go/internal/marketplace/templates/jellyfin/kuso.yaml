apiVersion: kuso/v1
project: jellyfin
services:
  - name: jellyfin
    runtime: image
    port: 8096
    image:
      repository: jellyfin/jellyfin
      tag: "10.11.11"
    env:
      JELLYFIN_PublishedServerUrl: "https://${{ prompt.host }}"
    domains:
      - host: "${{ prompt.host }}"
        tls: true
    volumes:
      - name: config
        mountPath: /config
        sizeGi: 5
      - name: cache
        mountPath: /cache
        sizeGi: 5
      - name: media
        mountPath: /media
        sizeGi: 50
    scale: { min: 1, max: 1 }

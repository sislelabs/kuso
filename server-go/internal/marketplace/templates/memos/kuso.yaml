apiVersion: kuso/v1
project: memos
services:
  - name: memos
    runtime: image
    port: 5230
    image:
      repository: neosmemo/memos
      tag: "26.11.0"
    domains:
      - host: "${{ prompt.host }}"
        tls: true
    volumes:
      - name: data
        mountPath: /var/opt/memos
        sizeGi: 2
    # SQLite on an RWO volume: one instance only.
    scale: { min: 1, max: 1 }
    # The entrypoint chowns the data dir, then drops to uid 10001 via su-exec.
    securityContext:
      capabilities:
        add: ["SETUID", "SETGID", "CHOWN", "DAC_OVERRIDE", "FOWNER"]
      allowPrivilegeEscalation: true

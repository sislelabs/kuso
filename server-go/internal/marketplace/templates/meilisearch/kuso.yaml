apiVersion: kuso/v1
project: meilisearch
services:
  - name: meilisearch
    runtime: image
    port: 7700
    image:
      repository: getmeili/meilisearch
      tag: "v1.56.1"
    env:
      MEILI_ENV: production
      MEILI_MASTER_KEY: { generate: hex32 }
    domains:
      - host: "${{ prompt.host }}"
        tls: true
    volumes:
      - name: data
        mountPath: /meili_data
        sizeGi: 5
    scale: { min: 1, max: 1 }

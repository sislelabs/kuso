name: excalidraw
title: Excalidraw
description: >-
  Virtual whiteboard for hand-drawn-style sketches and diagrams. Drawings
  stay in the browser; live collaboration is off in the self-hosted image.
  Excalidraw publishes commit-tagged images only, so this pins a commit.

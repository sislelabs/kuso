apiVersion: kuso/v1
project: searxng
services:
  - name: searxng
    runtime: image
    port: 8080
    image:
      repository: searxng/searxng
      tag: "2026.11.6-ac11e14c5"
    env:
      SEARXNG_BASE_URL: "https://${{ prompt.host }}/"
    domains:
      - host: "${{ prompt.host }}"
        tls: true
    # settings.yml (with its generated secret_key) is written here on first start.
    volumes:
      - name: config
        mountPath: /etc/searxng
        sizeGi: 1
    scale: { min: 1, max: 1 }

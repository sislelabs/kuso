apiVersion: kuso/v1
project: docuseal
services:
  - name: docuseal
    runtime: image
    port: 3000
    image:
      repository: docuseal/docuseal
      tag: "3.3.5"
    env:
      HOST: "${{ prompt.host }}"
      DATABASE_URL: "${{ docuseal-db.DATABASE_URL }}"
    domains:
      - host: "${{ prompt.host }}"
        tls: true
    volumes:
      - name: data
        mountPath: /data
        sizeGi: 5
addons:
  - name: docuseal-db
    kind: postgres
    version: "16"

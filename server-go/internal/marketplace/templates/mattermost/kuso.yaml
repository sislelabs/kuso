apiVersion: kuso/v1
project: mattermost
services:
  - name: mattermost
    runtime: image
    port: 8065
    image:
      repository: mattermost/mattermost-team-edition
      tag: "12.1.0"
    env:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "${{ mattermost-db.DATABASE_URL }}"
      MM_SERVICESETTINGS_SITEURL: "https://${{ prompt.host }}"
    domains:
      - host: "${{ prompt.host }}"
        tls: true
    volumes:
      - name: data
        mountPath: /mattermost/data
        sizeGi: 10
      - name: plugins
        mountPath: /mattermost/plugins
        sizeGi: 1
    scale: { min: 1, max: 1 }
addons:
  - name: mattermost-db
    kind: postgres
    version: "16"

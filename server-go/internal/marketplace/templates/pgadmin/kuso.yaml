apiVersion: kuso/v1
project: pgadmin
services:
  - name: pgadmin
    runtime: image
    port: 5050
    image:
      repository: dpage/pgadmin4
      tag: "9.19.0"
    env:
      PGADMIN_DEFAULT_EMAIL: "${{ prompt.admin_email }}"
      PGADMIN_DEFAULT_PASSWORD: "${{ prompt.admin_password }}"
      PGADMIN_LISTEN_PORT: "5050"
    domains:
      - host: "${{ prompt.host }}"
        tls: true
    volumes:
      - name: data
        mountPath: /var/lib/pgadmin
        sizeGi: 1
    scale: { min: 1, max: 1 }
    # gunicorn runs from a python copy carrying the NET_BIND_SERVICE file
    # capability; exec'ing it fails unless that cap is in the bounding set.
    securityContext:
      capabilities:
        add: ["NET_BIND_SERVICE"]
      allowPrivilegeEscalation: true

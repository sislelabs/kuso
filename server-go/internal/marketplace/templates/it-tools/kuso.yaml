apiVersion: kuso/v1
project: it-tools
services:
  - name: it-tools
    runtime: image
    port: 80
    image:
      repository: corentinth/it-tools
      tag: "2024.10.22-7ca5933"
    domains:
      - host: "${{ prompt.host }}"
        tls: true
    # Stock nginx: the master binds :80 as root, chowns its cache dirs and
    # runs workers as the nginx user.
    securityContext:
      capabilities:
        add: ["NET_BIND_SERVICE", "SETUID", "SETGID", "CHOWN"]
      allowPrivilegeEscalation: true

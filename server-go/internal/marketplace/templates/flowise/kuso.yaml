apiVersion: kuso/v1
project: flowise
services:
  - name: flowise
    runtime: image
    port: 3000
    image:
      repository: flowiseai/flowise
      tag: "3.1.4"
    env:
      APP_URL: "https://${{ prompt.host }}"
      DATABASE_TYPE: postgres
      DATABASE_HOST: "${{ flowise-db.POSTGRES_HOST }}"
      DATABASE_PORT: "${{ flowise-db.POSTGRES_PORT }}"
      DATABASE_NAME: "${{ flowise-db.POSTGRES_DB }}"
      DATABASE_USER: "${{ flowise-db.POSTGRES_USER }}"
      DATABASE_PASSWORD: "${{ flowise-db.POSTGRES_PASSWORD }}"
      # Encryption key, auth secrets, uploads and logs live here.
      SECRETKEY_PATH: /data
      BLOB_STORAGE_PATH: /data/storage
      LOG_PATH: /data/logs
    domains:
      - host: "${{ prompt.host }}"
        tls: true
    volumes:
      - name: data
        mountPath: /data
        sizeGi: 2
    scale: { min: 1, max: 1 }
addons:
  - name: flowise-db
    kind: postgres
    version: "16"

apiVersion: kuso/v1
project: nocodb
services:
  - name: nocodb
    runtime: image
    port: 8080
    image:
      repository: nocodb/nocodb
      tag: "2026.10.1"
    env:
      DATABASE_URL: "${{ nocodb-db.DATABASE_URL }}"
      NC_AUTH_JWT_SECRET: { generate: hex32 }
      NC_PUBLIC_URL: "https://${{ prompt.host }}"
      NC_ADMIN_EMAIL: "${{ prompt.admin_email }}"
      NC_ADMIN_PASSWORD: "${{ prompt.admin_password }}"
    domains:
      - host: "${{ prompt.host }}"
        tls: true
    volumes:
      - name: data
        mountPath: /usr/app/data
        sizeGi: 5
addons:
  - name: nocodb-db
    kind: postgres
    version: "16"

apiVersion: kuso/v1
project: ghost
services:
  - name: ghost
    runtime: image
    port: 2368
    image:
      repository: ghost
      tag: "6.75.0-alpine"
    env:
      url: "https://${{ prompt.host }}"
      database__client: mysql
      database__connection__host: "${{ ghost-db.MYSQL_HOST }}"
      database__connection__user: "${{ ghost-db.MYSQL_USER }}"
      database__connection__password: "${{ ghost-db.MYSQL_PASSWORD }}"
      database__connection__database: "${{ ghost-db.MYSQL_DB }}"
    domains:
      - host: "${{ prompt.host }}"
        tls: true
    volumes:
      - name: content
        mountPath: /var/lib/ghost/content
        sizeGi: 5
    # Ghost keeps in-process state (scheduler, caches): one instance only.
    scale: { min: 1, max: 1 }
    # The entrypoint chowns the content dir, then drops to `node` via su-exec.
    securityContext:
      capabilities:
        add: ["SETUID", "SETGID", "CHOWN", "DAC_OVERRIDE", "FOWNER"]
      allowPrivilegeEscalation: true
addons:
  - name: ghost-db
    kind: mysql
    version: "8.0"

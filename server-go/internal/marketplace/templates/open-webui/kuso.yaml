apiVersion: kuso/v1
project: open-webui
services:
  - name: open-webui
    runtime: image
    port: 8080
    image:
      repository: ghcr.io/open-webui/open-webui
      tag: "v0.13.2"
    env:
      WEBUI_URL: "https://${{ prompt.host }}"
      WEBUI_SECRET_KEY: { generate: hex32 }
    domains:
      - host: "${{ prompt.host }}"
        tls: true
    volumes:
      - name: data
        mountPath: /app/backend/data
        sizeGi: 10
    scale: { min: 1, max: 1 }

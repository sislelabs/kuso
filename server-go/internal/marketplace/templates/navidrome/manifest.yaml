name: navidrome
title: Navidrome
description: >-
  Music server and streamer compatible with Subsonic/Airsonic clients. Log
  in as `admin` with the password you set. Music goes in the /music volume.
category: media
website: https://www.navidrome.org
appVersion: "0.64.2"
prompts:
  - key: host
    title: Domain
    kind: domain
    required: true
    help: The hostname Navidrome will be served on.
  - key: admin_password
    title: Admin password
    kind: password
    required: true
    help: Password for the `admin` user, created on first boot.

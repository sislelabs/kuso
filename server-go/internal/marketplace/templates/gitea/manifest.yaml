name: gitea
title: Gitea
description: >-
  Self-hosted, lightweight Git service. Public sign-up is off; create the
  admin with `kuso shell <project> gitea`, then
  `su git -c "gitea admin user create --admin --username <name> --email <email> --random-password"`.
category: dev-tools
website: https://gitea.io
appVersion: "1.22.3"
size: medium
prompts:
  - key: host
    title: Domain
    kind: domain
    required: true
    help: The hostname Gitea will be served on.

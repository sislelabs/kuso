apiVersion: kuso/v1
project: kroki
services:
  - name: kroki
    runtime: image
    port: 8000
    image:
      repository: yuzutech/kroki
      tag: "0.35.0"
    env:
      # Blocks diagram includes that read files or fetch URLs.
      KROKI_SAFE_MODE: secure
    domains:
      - host: "${{ prompt.host }}"
        tls: true

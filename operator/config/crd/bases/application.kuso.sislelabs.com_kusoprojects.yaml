---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: kusoprojects.application.kuso.sislelabs.com
spec:
  group: application.kuso.sislelabs.com
  names:
    kind: KusoProject
    listKind: KusoProjectList
    plural: kusoprojects
    singular: kusoproject
    shortNames: [kp, kproj]
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Repo
          type: string
          jsonPath: .spec.defaultRepo.url
        - name: Branch
          type: string
          jsonPath: .spec.defaultRepo.defaultBranch
        - name: Previews
          type: boolean
          jsonPath: .spec.previews.enabled
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          description: KusoProject is the top-level grouping for one product.
          type: object
          properties:
            apiVersion: { type: string }
            kind: { type: string }
            metadata: { type: object }
            spec:
              type: object
              properties:
                description:
                  type: string
                baseDomain:
                  type: string
                  description: Domain under which auto-generated service hostnames are emitted.
                namespace:
                  type: string
                  description: |
                    Optional execution namespace for this project's child
                    resources (services, environments, addons, builds,
                    plus their per-service Secrets). The KusoProject CR
                    itself always lives in the server's home namespace;
                    this field controls only child routing. Empty = home.
                defaultRepo:
                  type: object
                  properties:
                    url:
                      type: string
                    defaultBranch:
                      type: string
                      default: main
                    path:
                      type: string
                    provider:
                      type: string
                    tokenSecret:
                      type: string
                github:
                  type: object
                  properties:
                    installationId:
                      type: integer
                      format: int64
                previews:
                  type: object
                  properties:
                    enabled:
                      type: boolean
                      default: false
                    ttlDays:
                      type: integer
                      default: 7
                    baseDomain:
                      type: string
                      description: >-
                        Base domain for preview hosts. When set, previews
                        are <short>-pr-<N>.<baseDomain> (e.g.
                        frontend-pr-35.tickero.bg) instead of the project's
                        spec.baseDomain. Requires wildcard DNS for
                        *.<baseDomain> + a cert-manager HTTP-01 issuer.
                    triggers:
                      type: array
                      description: >-
                        Gate preview-env spawn on PR target branch.
                        Empty = pre-v0.17 behavior (spawn on every PR).
                        Non-empty = only PRs targeting one of the listed
                        branches spawn a preview; the matched entry's
                        baseEnv selects which existing env to clone
                        env-vars and addon subscriptions from.
                      items:
                        type: object
                        required: [branch, baseEnv]
                        properties:
                          branch:
                            type: string
                          baseEnv:
                            type: string
                    defaultReviewerEmail:
                      type: string
                      description: >-
                        Address kuso sends the magic-link reviewer URL
                        to when the PR has no `reviewer:<email>` label.
                        Empty = no email; operator gets the URL only
                        from the dashboard + GitHub PR comment.
                    allowForkPreviews:
                      type: boolean
                      default: false
                      description: >-
                        Opt INTO building preview envs for PRs from a
                        fork opened by an untrusted author. Dangerous: a
                        fork PR runs attacker-supplied build/seed code
                        in-cluster with the project's production addon +
                        shared secrets mounted. Default false — fork PRs
                        are skipped unless the author is a repo
                        OWNER/MEMBER/COLLABORATOR. Only enable for
                        private/trusted repos.
                configAsCode:
                  type: object
                  description: >-
                    Controls the kuso.yaml-on-push behaviour. When
                    enabled (default), a push to the default branch
                    makes kuso fetch kuso.yaml via the GitHub Contents
                    API and apply it before builds run.
                  properties:
                    enabled:
                      type: boolean
                      default: true
                alwaysOn:
                  type: boolean
                  description: |
                    When true, every service in this project runs with
                    sleep.enabled=false regardless of per-service sleep
                    config. Lets a project opt out of scale-to-zero
                    globally — useful when cold-start latency is
                    unacceptable (low-traffic but latency-sensitive
                    APIs, background processors that must always be
                    listening).
                  default: false
                incidentMonitoring:
                  type: boolean
                  description: |
                    Opt this project into the incident-response agent.
                    The agent only investigates crashes/alerts/node
                    events for projects with this set to true — opt-in,
                    so a noisy or low-priority project doesn't burn agent
                    runs. Gated additionally by the global incident-agent
                    enable. Default false (not monitored).
                  default: false
                uptime:
                  type: object
                  description: |
                    Uptime checks. kuso pings every production web
                    service once a minute and notifies when one stops
                    answering. On by default.
                  properties:
                    disabled:
                      type: boolean
                      description: |
                        When true, no service in this project is pinged.
                placement:
                  type: object
                  description: |
                    Project-default node-pinning policy. Services
                    without their own placement inherit it; new
                    environments derived from a service inherit the
                    service's effective placement (with project as
                    fallback). Empty = schedule anywhere.
                  properties:
                    labels:
                      type: object
                      description: |
                        Node-label matchers (AND across keys). The
                        server prefixes them with kuso.sislelabs.com/
                        behind the scenes so user-typed labels are
                        kept in a separate namespace from kube's.
                      additionalProperties: { type: string }
                    nodes:
                      type: array
                      description: |
                        Specific hostnames the workload may schedule
                        onto. Combines with labels via AND: a node
                        must match all labels AND be in this list
                        (when set), or match all labels (when empty).
                      items: { type: string }
                networkPolicy:
                  type: object
                  description: |
                    Per-project NetworkPolicy knobs read by the kusoproject
                    chart (see its values.yaml). Without this schema the
                    apiserver pruned the block, so e.g. extraBlockCIDRs (the
                    control-plane public IP on cloud installs) could never
                    be set. Unset fields keep the chart defaults.
                  properties:
                    enabled:
                      type: boolean
                    platformNamespace:
                      type: string
                    extraBlockCIDRs:
                      type: array
                      items: { type: string }
                    extraIngressNamespaces:
                      type: array
                      items: { type: string }
                requestLimits:
                  type: object
                  description: >-
                    Limits on this service's use of the shared ingress, per
                    Traefik replica and per Host. Unset fields fall back to
                    the project's requestLimits, then the chart default
                    (maxConcurrent 1000, no rate limit).
                  properties:
                    maxConcurrent:
                      type: integer
                      minimum: -1
                      maximum: 1000000
                      description: >-
                        Requests in flight at once; past it the service
                        answers 429. -1 = no cap.
                    ratePerSecond:
                      type: integer
                      minimum: -1
                      maximum: 1000000
                      description: Sustained requests per second. -1 = no limit.
                    burst:
                      type: integer
                      minimum: 0
                      maximum: 1000000
                      description: Requests allowed above the rate at once. Unset = the rate.
                quota:
                  type: object
                  description: |
                    Per-project ResourceQuota + LimitRange (kusoproject
                    chart). Off unless enabled; unset fields keep the chart
                    defaults.
                  properties:
                    enabled:
                      type: boolean
                    cpu: { type: string }
                    memory: { type: string }
                    pods: { type: string }
                    pvcs: { type: string }
                    services: { type: string }
                    defaultPodCPURequest: { type: string }
                    defaultPodMemoryRequest: { type: string }
                    defaultPodCPULimit: { type: string }
                    defaultPodMemoryLimit: { type: string }
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true

# Default values for KusoCron CRs. The kuso server populates these
# fields from KusoCron.spec before passing them to helm-operator.
project: ""
# kind ∈ {service, http, command}. Empty defaults to "service" for
# back-compat with crons created before v0.8.
kind: ""
service: ""
# url: target for kind=http probes. Ignored for other kinds.
url: ""
# Cron expression — server validates before write so we don't have to
# re-validate here.
schedule: ""
# argv for the container. First element is the binary.
command: []
# Image — copied from the parent service's production env so this
# cron runs the same code as `kubectl exec` in the service pod.
image:
  repository: ""
  tag: latest
  pullPolicy: IfNotPresent
  # dockerconfigjson Secret for private registries (KusoImage.pullSecret).
  pullSecret: ""
# Envs from the same connection-secrets every service in the project
# already picks up via envFrom.
envFromSecrets: []
# env: the owning env's resolved envVars (plain key/value AND ${{ }}
# aliases carried as valueFrom), so the cron sees the same env as the
# service's pods. Same shape as KusoRun.spec.env. Ignored for kind=http.
env: []
# Knobs documented on the CRD.
suspend: false
concurrencyPolicy: Forbid
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
activeDeadlineSeconds: 0
# startingDeadlineSeconds bounds the missed-schedule lookback so a
# CronJob that falls >100 schedules behind self-heals instead of
# wedging permanently. 0 = unset (kube default: unbounded lookback).
startingDeadlineSeconds: 300
# Pod placement — same shape as services. region label gets a
# matching toleration so the kuso.sislelabs.com/region NoSchedule
# taint doesn't block scheduling.
placement: {}
# Egress gates, copied from the owning service's spec. The project
# NetworkPolicy is default-deny: without the public-egress pod label
# (stamped unless privateEgress) the job can't reach the internet.
privateEgress: false
platformApiEgress: false
resources: {}

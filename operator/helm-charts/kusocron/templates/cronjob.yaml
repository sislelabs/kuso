apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "kusocron.fullname" . }}
  labels:
    {{- include "kusocron.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.schedule | quote }}
  {{- /* Suspend while the service has no built image yet. crons.go
     passes env.Spec.Image straight through, and a pre-first-build env
     legitimately has an empty repository — which rendered
     `image: ":latest"` and made every firing fail InvalidImageName.
     kusoenvironment guards the same case by pinning replicas: 0; for a
     CronJob the equivalent is to not fire at all until an image
     exists. Once the first build promotes, this flips back to the
     user's own suspend setting.

     kind=http is exempt: it has NO image by design (the container
     hardcodes curlimages/curl below), so the no-image guard would
     otherwise pin every http cron suspended forever. Only apply the
     guard to non-http kinds, which do carry a service/command image. */}}
  suspend: {{ if and (ne (default "service" .Values.kind) "http") (not .Values.image.repository) }}true{{ else }}{{ .Values.suspend }}{{ end }}
  concurrencyPolicy: {{ .Values.concurrencyPolicy }}
  {{- /* startingDeadlineSeconds bounds how far behind the controller
     will look for missed schedules. Without it, a CronJob that misses
     >100 consecutive schedules (e.g. suspended over a long window, or a
     control-plane outage) permanently wedges — the controller refuses
     to start any Job and never self-heals. A finite deadline caps the
     miss-count window so it recovers on the next tick. */}}
  {{- if gt (int .Values.startingDeadlineSeconds) 0 }}
  startingDeadlineSeconds: {{ .Values.startingDeadlineSeconds }}
  {{- end }}
  successfulJobsHistoryLimit: {{ .Values.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.failedJobsHistoryLimit }}
  jobTemplate:
    # Labels on the JOB itself, not just its pod template. Kubernetes
    # does NOT copy CronJob labels onto the Jobs it spawns, and the two
    # existing label blocks sit on either side of the Job: one on the
    # CronJob (top of this file), one on the pod template below.
    #
    # cronwatch.Watcher LISTs *Jobs* with selector
    # kuso.sislelabs.com/cron and then reads that label's VALUE to find
    # the KusoCron CR (cronwatch.go:214). Without this block the Jobs
    # matched the selector but carried an empty value, so handleFailure
    # returned immediately and cron.failed notify events, bell-icon
    # entries and per-cron onFailure webhooks never fired — a silent,
    # total loss of cron failure alerting.
    #
    # cronwatch_test.go hand-builds its fixture Job WITH this label,
    # which is why the unit test passed while production saw nothing.
    metadata:
      labels:
        {{- include "kusocron.labels" . | nindent 8 }}
    spec:
      {{- if gt (int .Values.activeDeadlineSeconds) 0 }}
      activeDeadlineSeconds: {{ .Values.activeDeadlineSeconds }}
      {{- end }}
      template:
        metadata:
          labels:
            {{- include "kusocron.labels" . | nindent 12 }}
        spec:
          restartPolicy: OnFailure
          {{- /* Pod securityContext is kind-dependent:

                 kind=http uses our own curlimages/curl image, whose
                 USER is the NON-NUMERIC name "curl_user" (UID 100).
                 kubelet's runAsNonRoot=true gate can't verify a named
                 user is non-root and rejects the pod with
                 CreateContainerConfigError — so we pin runAsUser:100
                 (curl's UID) to make the non-root proof numeric.

                 kind=service/command run the USER's own image, which
                 may declare its own named user (node, nginx, …). Same
                 reason kusoenvironment doesn't set runAsNonRoot pod-
                 wide: pinning a UID there would break those images.
                 Hardening still comes from the container's
                 capabilities.drop:ALL + allowPrivilegeEscalation:false
                 below. */}}
          securityContext:
            seccompProfile:
              type: RuntimeDefault
            {{- if eq (default "service" .Values.kind) "http" }}
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 100
            {{- end }}
          {{- /* Placement — same model as services + addons. region
                 label gets a matching toleration so the cron lands on
                 the right node when a region taint exists. */}}
          {{- with .Values.placement }}
          {{- if .labels }}
          nodeSelector:
            {{- range $k, $v := .labels }}
            {{ printf "kuso.sislelabs.com/%s" $k }}: {{ $v | quote }}
            {{- end }}
          {{- end }}
          {{- if .nodes }}
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: kubernetes.io/hostname
                        operator: In
                        values:
                          {{- range .nodes }}
                          - {{ . | quote }}
                          {{- end }}
          {{- end }}
          {{- if and .labels .labels.region }}
          tolerations:
            - key: kuso.sislelabs.com/region
              operator: Equal
              value: {{ .labels.region | quote }}
              effect: NoSchedule
          {{- end }}
          {{- end }}
          containers:
            - name: cron
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              {{- /* kind=http synthesises a curl probe. Image is
                     curlimages/curl — a 5MB scratch+curl image with
                     no other tools, which means no stray sh, no
                     package manager, minimal CVE surface. Pinned by
                     digest-friendly tag rather than :latest so two
                     cron firings on a fast-changing :latest can't
                     pull different code mid-rollout.

                     kind=service / kind=command honour what the
                     server stamped on the spec. */}}
              {{- if eq (default "service" .Values.kind) "http" }}
              image: "curlimages/curl:8.10.1"
              imagePullPolicy: IfNotPresent
              command: ["sh", "-c"]
              args:
                - |
                  set -e
                  echo "==> probe {{ .Values.url }}"
                  curl -fsS -o /dev/null -w "status=%{http_code} time=%{time_total}s\n" {{ .Values.url | quote }}
                  echo "==> ok"
              {{- else }}
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default "latest" }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                {{- range .Values.command }}
                - {{ . | quote }}
                {{- end }}
              {{- end }}
              {{- with .Values.envFromSecrets }}
              envFrom:
                {{- range . }}
                # optional=true mirrors the kusorun + kusoenvironment
                # charts — a missing secret (e.g. an addon uninstalled
                # while a cron still carries its conn-secret name)
                # shouldn't pin every cron fire in
                # CreateContainerConfigError with no alert. The Job still
                # starts; the missing-env-var hint surfaces in the code.
                - secretRef:
                    name: {{ . | quote }}
                    optional: true
                {{- end }}
              {{- end }}
              resources:
                {{- toYaml .Values.resources | nindent 16 }}

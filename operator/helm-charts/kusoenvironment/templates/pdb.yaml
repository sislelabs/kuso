{{- /*
  PodDisruptionBudget — protects the env from going to zero pods
  during voluntary disruptions (node drain on upgrade, kubectl
  drain for hardware swap, cluster autoscaler scale-down).

  Render only when the replica floor is at least 2 (replicaCount with
  the HPA off, autoscaling.minReplicas with it on). Keying on
  maxReplicas used to put minAvailable: 1 on HPA envs that idle at one
  pod, so disruptionsAllowed sat at 0 and every node drain blocked on
  the lone pod. When there's no second pod, a PDB protects nothing.
  Skipping it lets a drain evict the pod cleanly, and kubelet
  reschedules it within seconds.

  minAvailable: 1 is the safe default. Drains block while only one
  pod is up but allow normal rolling updates (which create a new
  pod before evicting the old one, so the budget stays satisfied
  throughout the rollout).
*/}}
{{- if ge (int (include "kusoenvironment.minReplicas" .)) 2 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "kusoenvironment.fullname" . }}
  labels:
    {{- include "kusoenvironment.labels" . | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "kusoenvironment.selectorLabels" . | nindent 6 }}
{{- end }}

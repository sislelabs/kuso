{{- if not .Values.done }}
{{- /* Gate on repository AND tag. Gating on tag alone let a
   pre-first-build service (empty repository, defaulted tag) render
   `image: ":latest"`, which kube rejects as InvalidImageName — the
   same gap kusocron had. */}}
{{- if and (.Values.image).repository (.Values.image).tag }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "kusorun.fullname" . }}
  labels:
    {{- include "kusorun.labels" . | nindent 4 }}
spec:
  {{- if gt (int .Values.timeoutSeconds) 0 }}
  activeDeadlineSeconds: {{ .Values.timeoutSeconds }}
  {{- end }}
  # The kuso runs poller treats the Job's terminal state as the
  # source of truth for the run's outcome. Once it's done we set
  # ttlSecondsAfterFinished so the Job (+ pod) is garbage-collected
  # without operator intervention. The KusoRun CR itself stays for
  # audit trail.
  # Only the poller flips .Values.done. If the Job is reaped before it
  # does (kuso-server down), helm-operator's reconcile recreates the Job
  # and re-runs the command, so the TTL must outlast any plausible
  # control-plane outage.
  ttlSecondsAfterFinished: 86400
  backoffLimit: 0
  template:
    metadata:
      labels:
        {{- include "kusorun.labels" . | nindent 8 }}
        {{- /* Same egress gates as the kusoenvironment pod template;
               values copied from the owning service by the server. */}}
        {{- if not .Values.privateEgress }}
        kuso.sislelabs.com/network-egress-public: "true"
        {{- end }}
        {{- if .Values.platformApiEgress }}
        kuso.sislelabs.com/network-egress-platform-api: "true"
        {{- end }}
    spec:
      # One-shot task pods run user-supplied commands with the
      # service's real production env. They have no reason to reach the
      # kube apiserver, so don't mount a ServiceAccount token — same
      # rule the kusoenvironment deployment and kusocron apply.
      automountServiceAccountToken: false
      restartPolicy: Never
      {{- with (.Values.image).pullSecret }}
      imagePullSecrets:
        - name: {{ . | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      {{- with .Values.placement }}
      {{- /* Empty-value labels are capability flags (e.g. `gpu`): a
             nodeSelector value "" exact-matches the empty string instead of
             checking presence, so they render as nodeAffinity Exists.
             Mirrors kusoenvironment/templates/deployment.yaml. */}}
      {{- $valueLabels := dict }}
      {{- $flagLabels := list }}
      {{- range $k, $v := .labels }}
      {{- if $v }}{{ $_ := set $valueLabels $k $v }}{{ else }}{{ $flagLabels = append $flagLabels $k }}{{ end }}
      {{- end }}
      {{- if $valueLabels }}
      nodeSelector:
        {{- range $k, $v := $valueLabels }}
        {{ printf "kuso.sislelabs.com/%s" $k }}: {{ $v | quote }}
        {{- end }}
      {{- end }}
      {{- if or .nodes $flagLabels }}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  {{- range $flagLabels }}
                  - key: {{ printf "kuso.sislelabs.com/%s" . | quote }}
                    operator: Exists
                  {{- end }}
                  {{- if .nodes }}
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      {{- range .nodes }}
                      - {{ . | quote }}
                      {{- end }}
                  {{- end }}
      {{- end }}
      {{- if and .labels .labels.region }}
      tolerations:
        - key: kuso.sislelabs.com/region
          operator: Equal
          value: {{ .labels.region | quote }}
          effect: NoSchedule
      {{- end }}
      {{- end }}
      {{- /*
        wait-for-addons: a brand-new pod's IP isn't in kube-router's
        NetworkPolicy allow ipsets until the next sync (~5-20s), so a run
        whose command connects straight away got `connection refused` from
        its own project's DB and exited 1. TCP-wait on whichever of
        DATABASE_URL / REDIS_URL / NATS_URL the run carries first; exits 0
        at once when none is set. Soft mode: an addon that never answers is
        logged and the command runs anyway (a URL the command never touches
        must not fail the run). Same env as the run container via
        kusorun.envBlock. Script is a verbatim copy of the Go const — see
        kusorun.waitForAddonsScript in _helpers.tpl.
      */}}
      initContainers:
        - name: wait-for-addons
          image: busybox:1.36
          command: ["sh", "-c", {{ include "kusorun.waitForAddonsScript" . | quote }}]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          {{- with include "kusorun.envBlock" (dict "Values" .Values "waitEnv" true) | trim }}{{ . | nindent 10 }}{{- end }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      containers:
        - name: run
          image: "{{ (.Values.image).repository }}:{{ (.Values.image).tag }}"
          imagePullPolicy: {{ (.Values.image).pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          command:
            {{- range .Values.command }}
            - {{ . | quote }}
            {{- end }}
          {{- with include "kusorun.envBlock" (dict "Values" .Values) | trim }}{{ . | nindent 10 }}{{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
{{- end }}
{{- end }}
